<!DOCTYPE html>
<html>
<head>
    <title>ComicCraft</title>
    <style>
        body{font-family:Arial;background:#f5f5f5;padding:40px}
        .box{background:white;max-width:600px;margin:auto;padding:30px;border-radius:15px;box-shadow:0 5px 20px rgba(0,0,0,0.1)}
        h1{color:#6c5ce7;text-align:center}
        input,textarea{width:100%;padding:12px;margin:10px 0;border:2px solid #ddd;border-radius:8px}
        button{background:#6c5ce7;color:white;padding:12px 20px;border:none;border-radius:8px;width:100%;font-size:16px;cursor:pointer}
        button:hover{background:#5a4bd1}
    </style>
</head>
<body>
    <div class="box">
        <h1>🎨 ComicCraft</h1>
        <p style="text-align:center;color:#666">Ungaloda story ah comic aakkunga!</p>
        <form action="/generate" method="post">
            <textarea name="story" rows="4" placeholder="Enter your story... Ex: A cat becomes superhero" required></textarea>
            <input type="number" name="panels" value="4" min="1" max="6" placeholder="Panels (1-6)">
            <button type="submit">✨ Generate Comic</button>
        </form>
    </div>
</body>
</html>
